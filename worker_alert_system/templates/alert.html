<!DOCTYPE html>
<html>

<head>
<title>Factory Emergency Alert</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:40px;
border-radius:15px;
box-shadow:0px 10px 20px rgba(0,0,0,0.1);
width:400px;
text-align:center;
}

h2{
margin-bottom:25px;
}

select, textarea{
width:100%;
padding:10px;
margin-bottom:20px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
background:red;
color:white;
padding:20px;
border:none;
font-size:20px;
border-radius:10px;
cursor:pointer;
width:100%;
}

button:hover{
background:darkred;
}

</style>

</head>

<body>

<div class="card">

<h2>🚨 Emergency Alert Panel</h2>

<label>Accident Type</label>

<select id="type">
<option>Fire</option>
<option>Building Collapse</option>
<option>Gas Leak</option>
<option>Machine Accident</option>
</select>

<label>Location</label>

<select id="location">
<option>Factory Block A</option>
<option>Factory Block B</option>
<option>Factory Block C</option>
<option>Warehouse</option>
</select>

<label>Message</label>

<textarea id="message">Evacuate immediately</textarea>

<button onclick="sendAlert()">🚨 ALERT WORKERS</button>

</div>

<script>

function sendAlert(){

let type=document.getElementById("type").value
let location=document.getElementById("location").value
let message=document.getElementById("message").value

fetch(`/alert?type=${type}&location=${location}&message=${message}`)

alert("Emergency alert sent!")

}

</script>

</body>

</html>
